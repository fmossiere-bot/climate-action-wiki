name: Build infographics.json

# Runs whenever an infographic page or image changes, then commits the
# regenerated wiki/infographics.json back to the repo. The gallery in the app
# fetches that file directly, so a push to the wiki is the only step needed
# to add an infographic. Nothing gets uploaded by hand.

on:
  push:
    paths:
      - 'wiki/infographics/**'
      - '.github/scripts/build_infographics.py'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, so the rebase below can work

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate infographics.json
        run: python3 .github/scripts/build_infographics.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wiki/infographics.json
          if git diff --staged --quiet; then
            echo "No change to infographics.json — skipping commit."
            exit 0
          fi
          git commit -m "chore: regenerate infographics.json [skip ci]"
          # A push touching wiki/infographics/*.md also starts
          # build-snippets.yml, so both may race to push. Rebase onto
          # whatever landed first and retry rather than failing red.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected, rebasing and retrying (attempt $attempt)"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            sleep 3
          done
          echo "Could not push after 3 attempts" >&2
          exit 1
